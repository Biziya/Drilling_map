# Techno Map settings. Owned by this page only: changing a value here never
# affects the Exploration Map.

title: Techno Map

# Where the drillholes come from:
#   mock    - the fixed demo dataset in mock/mockData.ts. No backend request,
#             nothing written to IndexedDB, and a "Demo" badge by the title.
#   backend - GET /api/techno-map (pyISR_AllData_V2), cached in IndexedDB
#             under techno-map. Never falls back to the demo dataset.
dataSource: backend

zoom:
  minZoom: 1
  maxZoom: 90
  zoomStep: 0.4
  # Zoom the wheel/button steps snap to, and the zoom from which deviation
  # lines are drawn.
  deviationMinZoom: 10
  # Space kept around the drillholes when Reset fits them into view, in px.
  fitPadding: 48

# Backgrounds offered by the header's base map switcher, in menu order, and
# the one shown on a first visit. The choice is remembered for this page only.
#   geological - the Redox Map: the surveyed base map image
#                (VITE_MAP_IMAGE_PATH). The id is kept so saved choices apply.
#   white-grid - a white sheet with an Easting/Northing grid over the same
#                UTM bounds, so every feature stays exactly where it is.
baseMap:
  options:
    - { id: geological, label: Redox Map }
    - { id: white-grid, label: White Grid Map }
  default: geological
  # White grid appearance; sizes in px, all above 0. Lines and labels keep
  # their size at every zoom.
  whiteGrid:
    background: '#ffffff'
    lineColor: '#d5dbe0'
    lineWidth: 1
    labelColor: '#5b6770'
    labelFontSize: 10.5
    # Smallest on-screen gap between grid lines. The step in metres is the
    # smallest 1/2/5 x 10^n value that keeps at least this gap, so the grid
    # refines as the map is zoomed in.
    minLineSpacing: 90

showLegends: true

# Display-only multiplier: a few metres of deviation is invisible at map scale.
deviationExaggeration: 5

rigIconSrc: /rig.svg

# Redox classes. The API does not return redox yet, no marker is coloured by
# it and the anchored legend no longer lists it; kept for when it arrives.
redox:
  Reduced: '#e1e1e1'
  Intermediate: '#ffffbe'
  Oxidized: '#dedec0'

# Drillhole types, in filter-panel and legend order. Each id is a category the
# API returns: the backend maps the SQL Type and the sampling flags onto it
# (backend/Models/TechnoMap/TechnoMapCategory.cs), and a hole with no category
# is not drawn. `color` fills the marker and its legend symbol, and colours the
# type's label in the Legends panel. Shapes: square, triangle, circle,
# diamond (vertical, taller than wide), triangle-down, pentagon, hexagon,
# star (five points), cross.
drillholeTypes:
  - { id: development, label: Development, shape: circle, color: '#ee7d14' }
  - { id: exploration, label: Exploration, shape: circle, color: '#ee7d14' }
  - { id: geotechnical, label: Geotechnical, shape: star, color: '#7b818a' }
  - { id: injector, label: Injector, shape: triangle-down, color: '#dc2626' }
  - { id: monitoring, label: Monitoring, shape: diamond, color: '#16a34a' }
  - { id: producer, label: Producer, shape: square, color: '#1d4ed8' }
  - { id: ra-grade-sampling, label: Ra-grade-sampling, shape: circle, color: '#ee7d14' }
  - { id: sediment-sampling, label: Sediment-sampling, shape: circle, color: '#ee7d14' }
  - { id: water, label: Water, shape: square, color: '#2bb3c0' }

# Marker sizes on the map, in px at every zoom, white outline included.
# Square and circle are drawn in a `size` box; the other shapes, which fill
# less of their box, in a `polygonSize` box. The rig icon is `rigSize` square.
markers:
  size: 13
  polygonSize: 15
  outline: 2
  rigSize: 32

# Map feature layers, in filter-panel and legend order.
mapFeatures:
  - { id: technological-cells, label: Technological cells }
  - { id: drilling-in-progress, label: Drilling in progress }
  - { id: deviation-line, label: Deviation line }

# Accessible role names, read before the hole id ("Producer drillhole GTZO-1").
markerLabels:
  rig: Drill rig
  development: Development drillhole
  exploration: Exploration drillhole
  geotechnical: Geotechnical drillhole
  injector: Injector drillhole
  monitoring: Monitoring drillhole
  producer: Producer drillhole
  ra-grade-sampling: Ra-grade-sampling drillhole
  sediment-sampling: Sediment-sampling drillhole
  water: Water drillhole

technologicalCells:
  stroke: '#166534'
  fill: 'rgba(34, 197, 94, 0.12)'

deviationLine:
  color: '#ff0000'

measurement:
  color: '#dc2626'

# The legend anchored in the map's top-left corner: one row per drillhole type,
# then the rig and the deviation line, in filter order (technological cells
# stay in the Legends panel only). Dimensions in px unless noted; all must be
# 0 or more. symbolSize is the one base size of every legend symbol. Each
# symbol is centred in a box 1.9 x symbolSize wide and as tall as the rig icon,
# so every label starts at the same x; the rig icon and line swatch scale too.
legend:
  paddingBlock: 8
  paddingInline: 10
  # Between rows.
  rowGap: 2
  labelFontSize: 11.5
  # Between a symbol or swatch and its label.
  labelGap: 6
  symbolSize: 13
  symbols:
    # Rig icon height as a multiple of symbolSize (a detailed image needs a
    # little more height to read at the same visual weight).
    rigIconScale: 1.35
    lineThickness: 2.5
