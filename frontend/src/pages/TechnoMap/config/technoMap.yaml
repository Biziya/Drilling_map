# Techno Map settings. Owned by this page only: changing a value here never
# affects the Exploration Map.

title: Techno Map

zoom:
  minZoom: 1
  # Zooming in stops when the scale bar reads this many metres (a bar of
  # about 100 px), whatever the base map's extent or the window size.
  minScaleBarMeters: 5
  # Hard cap on the CSS scale; the scale bar limit above is reached first.
  # SVG/grid overzoom needs no extra tiles. Marker sizes remain constant.
  maxZoom: 20000
  # Zoom is multiplicative, so a step feels the same at every depth.
  # Toolbar/double-click: each click multiplies the zoom by 1 + zoomStep.
  zoomStep: 0.4
  # Mouse wheel: each notch multiplies the zoom by 1 + wheelZoomStep.
  # Touchpads use fractional notches; a single wheel event is capped at one.
  wheelZoomStep: 0.6
  # Scale from which deviation lines are drawn; no threshold snapping.
  deviationMinZoom: 10
  # Space kept around the drillholes when Reset fits them into view, in px.
  fitPadding: 48

# Backgrounds offered by the header's base map switcher, in menu order, and
# the one shown on a first visit. The choice is remembered for this page only.
# An image map may name its own image (`src`, a public path) and the UTM
# rectangle that image covers (`bounds`, metres, max above min). Without them
# it uses VITE_MAP_IMAGE_PATH and the VITE_MAP_MIN_X/MAX_X/MIN_Y/MAX_Y bounds.
# The Techno Map has no redox map (the Exploration Map's redox map,
# public/base-map3.svg, covers the exploration area only).
#   geological - the surveyed base map image (VITE_MAP_IMAGE_PATH). It used to
#                be labelled "Redox Map"; the id is kept so saved choices apply.
#   white-grid - a white sheet with an Easting/Northing grid, laid out on the
#                (hidden) geological image and its bounds, so every feature
#                sits exactly where it does on the Geological Map.
baseMap:
  options:
    - { id: geological, label: Geological Map }
    - { id: white-grid, label: White Grid Map }
  default: geological
  # White grid appearance; sizes in px, all above 0. Lines and labels keep
  # their size at every zoom.
  whiteGrid:
    background: '#ffffff'
    lineColor: '#d5dbe0'
    lineWidth: 1
    labelColor: '#5b6770'
    labelFontSize: 10.5
    # Smallest on-screen gap between grid lines. The step in metres is the
    # smallest 1/2/5 x 10^n value that keeps at least this gap, so the grid
    # refines as the map is zoomed in.
    minLineSpacing: 90

showLegends: true

# Display-only multiplier: a few metres of deviation is invisible at map scale.
deviationExaggeration: 5

rigIconSrc: /rig.svg

# Redox classes. The API does not return redox yet, no marker is coloured by
# it and the anchored legend no longer lists it; kept for when it arrives.
redox:
  Reduced: '#e1e1e1'
  Intermediate: '#ffffbe'
  Oxidized: '#dedec0'

# Drillhole types, in filter-panel and legend order. Each id is a category the
# API returns: the backend maps the SQL Type and the sampling flags onto it
# (backend/Models/TechnoMap/TechnoMapCategory.cs), and a hole with no category
# is not drawn. `color` fills the marker and its legend symbol, and colours the
# type's label in the Layers panel. Shapes: square, triangle, circle,
# diamond (vertical, taller than wide), triangle-down, pentagon, hexagon,
# star (five points), cross.
drillholeTypes:
  - { id: development, label: Development, shape: circle, color: '#ee7d14' }
  - { id: exploration, label: Exploration, shape: circle, color: '#ee7d14' }
  - { id: geotechnical, label: Geotechnical, shape: star, color: '#7b818a' }
  - { id: injector, label: Injector, shape: triangle-down, color: '#dc2626' }
  - { id: monitoring, label: Monitoring, shape: diamond, color: '#16a34a' }
  - { id: producer, label: Producer, shape: square, color: '#1d4ed8' }
  - { id: ra-grade-sampling, label: Ra-grade-sampling, shape: circle, color: '#ee7d14' }
  - { id: sediment-sampling, label: Sediment-sampling, shape: circle, color: '#ee7d14' }
  - { id: water, label: Water, shape: square, color: '#2bb3c0' }

# Marker sizes on the map, in px at every zoom, white outline included.
# Square and circle are drawn in a `size` box; the other shapes, which fill
# less of their box, in a `polygonSize` box. The rig icon is `rigSize` square.
markers:
  size: 13
  polygonSize: 15
  outline: 2
  rigSize: 32

# Map feature layers, in filter-panel and legend order.
mapFeatures:
  - { id: drilling-in-progress, label: Drilling in progress }
  - { id: deviation-line, label: Deviation line }
  # Production-cell outlines from an uploaded wellfield Excel file (toolbar Upload).
  - { id: hexagon, label: Hexagons }
  # Site feature icons from public/site_features/site_features.yaml, one
  # checkbox per feature `type` there. Not listed in the legend. A type with
  # no entry here is always shown.
  - { id: pilot-factory, label: Pilot Factory, siteFeatureType: pilot_factory }
  - { id: mud-pit, label: Mud Pit, siteFeatureType: mud_pit }

# Accessible role names, read before the hole id ("Producer drillhole GTZO-1").
markerLabels:
  rig: Drill rig
  development: Development drillhole
  exploration: Exploration drillhole
  geotechnical: Geotechnical drillhole
  injector: Injector drillhole
  monitoring: Monitoring drillhole
  producer: Producer drillhole
  ra-grade-sampling: Ra-grade-sampling drillhole
  sediment-sampling: Sediment-sampling drillhole
  water: Water drillhole

hexagon:
  color: '#000000'
  lineWidth: 1.5

deviationLine:
  color: '#ff0000'

measurement:
  color: '#dc2626'

# Site features (public/site_features/site_features.yaml). Their dashed
# footprints are drawn once 100 px on screen covers at most this many metres
# (about web-map zoom 15 at this latitude); the icons show at every zoom.
siteFeatures:
  outlineMaxMetersPer100Px: 350

# Rings around a marker on the map: blue while the pointer is over it, green
# while a click keeps its popup pinned (pinned wins when both apply). The
# marker itself keeps its category colour.
interaction:
  hoverColor: '#2563eb'
  pinnedColor: '#16a34a'

