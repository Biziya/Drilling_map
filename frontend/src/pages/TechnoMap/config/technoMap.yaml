# Techno Map settings. Owned by this page only: changing a value here never
# affects the Exploration Map.

title: Techno Map

# Where the drillholes come from:
#   mock    - the fixed demo dataset in mock/mockData.ts. No backend request,
#             nothing written to IndexedDB, and a "Demo" badge by the title.
#   backend - GET /api/techno-map, cached in IndexedDB under techno-map.
dataSource: mock

zoom:
  minZoom: 1
  maxZoom: 90
  zoomStep: 0.4
  # Zoom the wheel/button steps snap to, and the zoom from which deviation
  # lines are drawn.
  deviationMinZoom: 10
  # Space kept around the drillholes when Reset fits them into view, in px.
  fitPadding: 48

showLegends: true

# Display-only multiplier: a few metres of deviation is invisible at map scale.
deviationExaggeration: 5

rigIconSrc: /rig.svg

# GT bands, lowest first. Each band includes its lower bound; the last band
# also includes its upper bound so the top of the scale is covered.
gtRanges:
  - { min: 0, max: 0.025, label: 0 – 0.025, color: '#dbeafe' }
  - { min: 0.025, max: 0.05, label: 0.025 – 0.05, color: '#93c5fd' }
  - { min: 0.05, max: 0.1, label: 0.05 – 0.1, color: '#38bdf8' }
  - { min: 0.1, max: 0.25, label: 0.1 – 0.25, color: '#22c55e' }
  - { min: 0.25, max: 0.5, label: 0.25 – 0.5, color: '#facc15' }
  - { min: 0.5, max: 4, label: 0.5 – 4, color: '#ef4444' }

# Legend only: the API does not return redox yet and no marker is coloured by it.
redox:
  Reduced: '#e1e1e1'
  Intermediate: '#ffffbe'
  Oxidized: '#dedec0'

# Drillhole types, in filter-panel and legend order. `purposes` are the
# HolePurpose values that mean this type; a purpose matching none of them is
# drawn as an injector. A marker is filled with its GT band colour, or with
# `color` when the hole has no GT reading. Shapes: square, triangle, circle,
# diamond, triangle-down, pentagon, hexagon, star, cross.
drillholeTypes:
  - { id: development, label: Development, shape: circle, color: '#7c3aed', purposes: [DEVELOP, DEVELOPMENT] }
  - { id: exploration, label: Exploration, shape: diamond, color: '#475569', purposes: [EXPLORE, EXPLORATION] }
  - { id: geotechnical, label: Geotechnical, shape: pentagon, color: '#92400e', purposes: [GEOTECH, GEOTECHNICAL] }
  - { id: injector, label: Injector, shape: square, color: '#1d4ed8', purposes: [INJECT, INJECTOR] }
  - { id: monitoring, label: Monitoring, shape: hexagon, color: '#db2777', purposes: [MONITOR, MONITORING] }
  - { id: producer, label: Producer, shape: triangle, color: '#ea580c', purposes: [PRODUCT, PRODUCER] }
  - { id: ra-grade-sampling, label: Ra-grade-sampling, shape: star, color: '#65a30d', purposes: [RASAMPLE, RA-GRADE-SAMPLING] }
  - { id: sediment-sampling, label: Sediment-sampling, shape: triangle-down, color: '#ca8a04', purposes: [SEDIMENT, SEDIMENT-SAMPLING] }
  - { id: water, label: Water, shape: cross, color: '#0891b2', purposes: [WATER] }

# Map feature layers, in filter-panel and legend order.
mapFeatures:
  - { id: technological-cells, label: Technological cells }
  - { id: drilling-in-progress, label: Drilling in progress }
  - { id: deviation-line, label: Deviation line }

# Accessible role names, read before the hole id ("Producer drillhole GTZO-1").
markerLabels:
  rig: Drill rig
  development: Development drillhole
  exploration: Exploration drillhole
  geotechnical: Geotechnical drillhole
  injector: Injector drillhole
  monitoring: Monitoring drillhole
  producer: Producer drillhole
  ra-grade-sampling: Ra-grade-sampling drillhole
  sediment-sampling: Sediment-sampling drillhole
  water: Water drillhole

technologicalCells:
  stroke: '#166534'
  fill: 'rgba(34, 197, 94, 0.12)'

deviationLine:
  color: '#ff0000'

measurement:
  color: '#dc2626'

# Legend dimensions, in px unless noted; all must be 0 or more.
# symbolSize is the one base size of every legend symbol: GT circles, Redox
# squares and the type shapes are all symbolSize x symbolSize. Each symbol is
# centred in a box 1.9 x symbolSize wide and as tall as the rig icon, so labels
# line up across all three sections; the rig icon and line/cell swatches scale
# with it too. Sections sit side by side at their content width and wrap.
legend:
  paddingBlock: 8
  paddingInline: 16
  # Between the GT, Redox and Symbol sections, across and (when they wrap) down.
  columnGap: 28
  rowGap: 8
  # Under each section title.
  titleGap: 4
  titleFontSize: 13
  labelFontSize: 12.5
  # Between a symbol or swatch and its label.
  labelGap: 6
  symbolSize: 15
  # GT bands fill `columns` columns top to bottom.
  gt: { columns: 2, rowGap: 3, columnGap: 16 }
  redox: { rowGap: 3 }
  symbols:
    # Rig icon height as a multiple of symbolSize (a detailed image needs a
    # little more height to read at the same visual weight).
    rigIconScale: 1.35
    lineThickness: 2.5
    rowGap: 3
    columnGap: 18
