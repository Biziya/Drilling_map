<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#1E3A5F"/>

  <!-- Ground surface on both sides -->
  <rect x="64" y="222" width="54" height="16" rx="8" fill="#F39C12"/>
  <rect x="394" y="222" width="54" height="16" rx="8" fill="#F39C12"/>

  <!-- Pit walls (earth) -->
  <polygon points="104,230 408,230 376,388 136,388" fill="#4A3424"/>
  <!-- Earth texture -->
  <circle cx="128" cy="300" r="4" fill="#6B4C35"/>
  <circle cx="140" cy="345" r="3" fill="#6B4C35"/>
  <circle cx="384" cy="300" r="4" fill="#6B4C35"/>
  <circle cx="372" cy="350" r="3" fill="#6B4C35"/>

  <!-- Mud with wavy surface -->
  <path d="M118,268 Q141,254 164,268 T210,268 T256,268 T302,268 T348,268 T394,268 L374,376 L138,376 Z" fill="#8B5A2B"/>
  <!-- Mud depth shading -->
  <path d="M130,330 Q256,350 382,330 L374,376 L138,376 Z" fill="#6E4420"/>

  <!-- Surface ripple lines -->
  <path d="M170,292 q20,-8 40,0" stroke="#B07A45" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M300,312 q22,-8 44,0" stroke="#B07A45" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Bubbles -->
  <circle cx="232" cy="318" r="14" fill="#A8723D"/>
  <circle cx="227" cy="313" r="4" fill="#D9A774"/>
  <circle cx="186" cy="342" r="8" fill="#A8723D"/>
  <circle cx="320" cy="282" r="9" fill="#A8723D"/>
  <circle cx="276" cy="350" r="6" fill="#A8723D"/>

  <!-- Popping bubble splash -->
  <circle cx="290" cy="236" r="6" fill="#B07A45"/>
  <circle cx="268" cy="224" r="4" fill="#B07A45"/>
  <circle cx="312" cy="222" r="5" fill="#B07A45"/>
  <circle cx="290" cy="206" r="3.5" fill="#B07A45"/>

  <!-- Label -->
  <text x="256" y="458" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="bold" letter-spacing="6" fill="#FFFFFF">MUD PIT</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
